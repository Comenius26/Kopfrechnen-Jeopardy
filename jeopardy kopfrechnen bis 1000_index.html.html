<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy - Kopfrechnen bis 1000</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background-color: #10141F;
    font-family: system-ui, Arial, sans-serif;
    color: #FFFFFF;
  }
  h1 {
    text-align: center;
    margin-bottom: 5px;
    font-size: 28px;
  }
  .subtitle {
    text-align: center;
    color: #B8BCC8;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .team-box {
    background-color: #1B2033;
    border: 2px solid #2EC4B6;
    border-radius: 14px;
    padding: 12px 20px;
    text-align: center;
    min-width: 180px;
  }
  .team-box.teamB {
    border-color: #FF7F50;
  }
  .team-box input {
    background: transparent;
    border: none;
    border-bottom: 1px solid #4A4F63;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    width: 140px;
    padding: 4px;
    margin-bottom: 6px;
    font-family: system-ui, Arial, sans-serif;
  }
  .team-score {
    font-size: 26px;
    font-weight: bold;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .cat-header {
    border-radius: 12px;
    padding: 12px 6px;
    text-align: center;
    font-weight: bold;
    font-size: 14px;
    color: #10141F;
    min-height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .point-card {
    border-radius: 12px;
    padding: 18px 6px;
    text-align: center;
    font-weight: bold;
    font-size: 20px;
    cursor: pointer;
    color: #10141F;
    border: none;
    transition: transform 0.1s;
  }
  .point-card:active {
    transform: scale(0.97);
  }
  .point-card.used {
    background-color: #2A2E3D !important;
    color: #565A6B;
    cursor: default;
  }
  .reset-wrap {
    text-align: center;
    margin-top: 25px;
  }
  .reset-btn {
    background-color: #1B2033;
    border: 2px solid #FF7F50;
    color: #FFFFFF;
    padding: 10px 22px;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
    font-family: system-ui, Arial, sans-serif;
  }
  .overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }
  .overlay.active {
    display: flex;
  }
  .popup {
    background-color: #1B2033;
    border-radius: 16px;
    padding: 30px;
    max-width: 600px;
    width: 100%;
    text-align: center;
    border: 2px solid #4A4F63;
  }
  .popup .cat-tag {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 8px;
    color: #10141F;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .popup .points-tag {
    color: #B8BCC8;
    font-size: 14px;
    margin-bottom: 18px;
  }
  .popup .question-text {
    font-size: 20px;
    margin-bottom: 20px;
    line-height: 1.4;
  }
  .popup .answer-box {
    background-color: #10141F;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    text-align: left;
    display: none;
  }
  .popup .answer-box.show {
    display: block;
  }
  .popup .answer-box .ans-label {
    color: #2EC4B6;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .btn {
    background-color: #2EC4B6;
    color: #10141F;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
    font-family: system-ui, Arial, sans-serif;
  }
  .team-btns {
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
  }
  .team-btns.show {
    display: flex;
  }
  .team-btns .btn.a-right { background-color: #2EC4B6; }
  .team-btns .btn.a-wrong { background-color: #7A2E27; color: #FFFFFF; }
  .team-btns .btn.b-right { background-color: #FF7F50; }
  .team-btns .btn.b-wrong { background-color: #7A2E27; color: #FFFFFF; }
  .close-btn {
    background-color: #4A4F63;
    color: #FFFFFF;
    margin-top: 15px;
  }
  .confirm-box {
    background-color: #1B2033;
    border-radius: 16px;
    padding: 30px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    border: 2px solid #FF7F50;
  }
</style>
</head>
<body>

<h1>Kopfrechnen bis 1000</h1>
<p class="subtitle">Jeopardy fuer den Mathematikunterricht</p>

<div class="scoreboard">
  <div class="team-box">
    <input type="text" id="teamAName" value="Team A">
    <div class="team-score" id="teamAScore">0</div>
  </div>
  <div class="team-box teamB">
    <input type="text" id="teamBName" value="Team B">
    <div class="team-score" id="teamBScore">0</div>
  </div>
</div>

<div class="board" id="board"></div>

<div class="reset-wrap">
  <button class="reset-btn" id="resetBtn">Spiel zuruecksetzen</button>
</div>

<div class="overlay" id="questionOverlay">
  <div class="popup">
    <div class="cat-tag" id="popupCat"></div>
    <div class="points-tag" id="popupPoints"></div>
    <div class="question-text" id="popupQuestion"></div>
    <button class="btn" id="showAnswerBtn">Antwort anzeigen</button>
    <div class="answer-box" id="answerBox">
      <div class="ans-label">Musterloesung:</div>
      <div id="answerText"></div>
    </div>
    <div class="team-btns" id="teamBtns">
      <button class="btn a-right" id="aRightBtn">Team A richtig</button>
      <button class="btn a-wrong" id="aWrongBtn">Team A falsch</button>
      <button class="btn b-right" id="bRightBtn">Team B richtig</button>
      <button class="btn b-wrong" id="bWrongBtn">Team B falsch</button>
    </div>
    <br>
    <button class="btn close-btn" id="closePopupBtn">Schliessen</button>
  </div>
</div>

<div class="overlay" id="resetOverlay">
  <div class="confirm-box">
    <p style="font-size:18px; margin-bottom:20px;">Spiel wirklich zuruecksetzen? Alle Punkte und Karten werden geloescht.</p>
    <button class="btn" id="confirmResetYes">Ja, zuruecksetzen</button>
    <button class="btn close-btn" id="confirmResetNo">Abbrechen</button>
  </div>
</div>

<script>

var categories = [
  {
    name: "Plus rechnen",
    color: "#2EC4B6",
    questions: [
      { points: 100, question: "120 + 150 = ?", answer: "270. So geht's: Erst die Hunderter zusammenzaehlen (100+100=200), dann die Zehner (20+50=70). Zusammen: 200+70 = 270." },
      { points: 200, question: "230 + 340 = ?", answer: "570. So geht's: Hunderter zusammenzaehlen (200+300=500), dann die Zehner (30+40=70). Zusammen: 500+70 = 570." },
      { points: 300, question: "245 + 132 = ?", answer: "377. So geht's: Hunderter (200+100=300), Zehner (40+30=70), Einer (5+2=7). Zusammen: 300+70+7 = 377." },
      { points: 400, question: "368 + 215 = ?", answer: "583. So geht's: Hunderter (300+200=500), Zehner (60+10=70), Einer (8+5=13). Zusammen: 500+70+13 = 583." },
      { points: 500, question: "450 + 290 = ?", answer: "740. Trick: 290 ist fast 300. Rechne 450+300=750 und ziehe dann 10 wieder ab: 750-10 = 740." }
    ]
  },
  {
    name: "Minus rechnen",
    color: "#FF7F50",
    questions: [
      { points: 100, question: "180 - 50 = ?", answer: "130. So geht's: Vom Hunderter rechnen: 180-50 = 130." },
      { points: 200, question: "360 - 140 = ?", answer: "220. So geht's: Hunderter (300-100=200), Zehner (60-40=20). Zusammen: 200+20 = 220." },
      { points: 300, question: "425 - 213 = ?", answer: "212. So geht's: Hunderter (400-200=200), Zehner (20-10=10), Einer (5-3=2). Zusammen: 200+10+2 = 212." },
      { points: 400, question: "530 - 180 = ?", answer: "350. Trick: 180 ist fast 200. Rechne 530-200=330 und zaehle dann 20 wieder dazu: 330+20 = 350." },
      { points: 500, question: "710 - 285 = ?", answer: "425. Trick: 285 ist fast 300. Rechne 710-300=410 und zaehle dann 15 wieder dazu: 410+15 = 425." }
    ]
  },
  {
    name: "Mal nehmen",
    color: "#B388EA",
    questions: [
      { points: 100, question: "4 x 20 = ?", answer: "80. So geht's: 4 x 2 = 8, dann eine Null anhaengen: 80." },
      { points: 200, question: "7 x 30 = ?", answer: "210. So geht's: 7 x 3 = 21, dann eine Null anhaengen: 210." },
      { points: 300, question: "6 x 50 = ?", answer: "300. So geht's: 6 x 5 = 30, dann eine Null anhaengen: 300." },
      { points: 400, question: "9 x 40 = ?", answer: "360. So geht's: 9 x 4 = 36, dann eine Null anhaengen: 360." },
      { points: 500, question: "12 x 25 = ?", answer: "300. Tipp: 25 ist ein Viertel von 100. Rechne 12 x 100 = 1200, dann teile durch 4: 1200 : 4 = 300." }
    ]
  },
  {
    name: "Teilen",
    color: "#7AE582",
    questions: [
      { points: 100, question: "100 : 5 = ?", answer: "20. So geht's: 10 : 5 = 2, dann eine Null anhaengen: 20." },
      { points: 200, question: "240 : 4 = ?", answer: "60. So geht's: 24 : 4 = 6, dann eine Null anhaengen: 60." },
      { points: 300, question: "360 : 6 = ?", answer: "60. So geht's: 36 : 6 = 6, dann eine Null anhaengen: 60." },
      { points: 400, question: "450 : 9 = ?", answer: "50. So geht's: 45 : 9 = 5, dann eine Null anhaengen: 50." },
      { points: 500, question: "720 : 8 = ?", answer: "90. So geht's: 72 : 8 = 9, dann eine Null anhaengen: 90." }
    ]
  },
  {
    name: "Sachaufgaben",
    color: "#FFD166",
    questions: [
      { points: 100, question: "Ein T-Shirt kostet 15 Euro. Du kaufst 2 T-Shirts. Wie viel bezahlst du?", answer: "30 Euro. So geht's: 15 + 15 = 30." },
      { points: 200, question: "Du hast 50 Euro. Du kaufst Kopfhoerer fuer 18 Euro. Wie viel Geld hast du noch?", answer: "32 Euro. So geht's: 50 - 18 = 32." },
      { points: 300, question: "Ein Bus faehrt 120 Kilometer am Tag. Wie viele Kilometer faehrt er in 5 Tagen?", answer: "600 Kilometer. So geht's: 120 x 5 = 600." },
      { points: 400, question: "In einer Sporthalle sitzen 240 Zuschauer, verteilt auf 6 Reihen. Wie viele Zuschauer sitzen in jeder Reihe?", answer: "40 Zuschauer. So geht's: 240 : 6 = 40." },
      { points: 500, question: "Du sparst fuer ein Fahrrad. Du hast schon 320 Euro. Du bekommst noch 85 Euro Taschengeld und 45 Euro zum Geburtstag dazu. Wie viel Geld hast du jetzt?", answer: "450 Euro. So geht's: 320 + 85 = 405, dann 405 + 45 = 450." }
    ]
  }
];

var scores = { A: 0, B: 0 };
var usedCards = [];
var currentCat = -1;
var currentQ = -1;

function initUsedCards() {
  usedCards = [];
  var i;
  for (i = 0; i < categories.length; i++) {
    usedCards.push([false, false, false, false, false]);
  }
}

function buildBoard() {
  var board = document.getElementById("board");
  board.innerHTML = "";
  var i;
  for (i = 0; i < categories.length; i++) {
    var header = document.createElement("div");
    header.className = "cat-header";
    header.style.backgroundColor = categories[i].color;
    header.textContent = categories[i].name;
    board.appendChild(header);
  }
  var j;
  for (j = 0; j < 5; j++) {
    var k;
    for (k = 0; k < categories.length; k++) {
      var card = document.createElement("div");
      card.className = "point-card";
      card.style.backgroundColor = categories[k].color;
      card.textContent = categories[k].questions[j].points;
      card.setAttribute("data-cat", k);
      card.setAttribute("data-q", j);
      if (usedCards[k][j]) {
        card.className = "point-card used";
        card.textContent = "";
      }
      card.onclick = makeCardClickHandler(k, j);
      board.appendChild(card);
    }
  }
}

function makeCardClickHandler(catIndex, qIndex) {
  return function() {
    if (usedCards[catIndex][qIndex]) {
      return;
    }
    openQuestion(catIndex, qIndex);
  };
}

function openQuestion(catIndex, qIndex) {
  currentCat = catIndex;
  currentQ = qIndex;
  var cat = categories[catIndex];
  var q = cat.questions[qIndex];
  var popupCat = document.getElementById("popupCat");
  popupCat.textContent = cat.name;
  popupCat.style.backgroundColor = cat.color;
  document.getElementById("popupPoints").textContent = q.points + " Punkte";
  document.getElementById("popupQuestion").textContent = q.question;
  document.getElementById("answerText").textContent = q.answer;
  document.getElementById("answerBox").className = "answer-box";
  document.getElementById("teamBtns").className = "team-btns";
  document.getElementById("showAnswerBtn").style.display = "inline-block";
  document.getElementById("questionOverlay").className = "overlay active";
}

function closeQuestion() {
  document.getElementById("questionOverlay").className = "overlay";
  currentCat = -1;
  currentQ = -1;
}

function showAnswer() {
  document.getElementById("answerBox").className = "answer-box show";
  document.getElementById("teamBtns").className = "team-btns show";
  document.getElementById("showAnswerBtn").style.display = "none";
}

function updateScoreDisplay() {
  document.getElementById("teamAScore").textContent = scores.A;
  document.getElementById("teamBScore").textContent = scores.B;
}

function awardPoints(team, correct) {
  if (currentCat < 0 || currentQ < 0) {
    return;
  }
  var pts = categories[currentCat].questions[currentQ].points;
  if (team === "A") {
    if (correct) {
      scores.A = scores.A + pts;
    } else {
      scores.A = scores.A - pts;
      if (scores.A < 0) {
        scores.A = 0;
      }
    }
  } else {
    if (correct) {
      scores.B = scores.B + pts;
    } else {
      scores.B = scores.B - pts;
      if (scores.B < 0) {
        scores.B = 0;
      }
    }
  }
  updateScoreDisplay();
  usedCards[currentCat][currentQ] = true;
  closeQuestion();
  buildBoard();
}

function openResetConfirm() {
  document.getElementById("resetOverlay").className = "overlay active";
}

function closeResetConfirm() {
  document.getElementById("resetOverlay").className = "overlay";
}

function performReset() {
  scores.A = 0;
  scores.B = 0;
  updateScoreDisplay();
  initUsedCards();
  buildBoard();
  closeResetConfirm();
}

document.getElementById("showAnswerBtn").onclick = showAnswer;
document.getElementById("closePopupBtn").onclick = closeQuestion;
document.getElementById("aRightBtn").onclick = function() { awardPoints("A", true); };
document.getElementById("aWrongBtn").onclick = function() { awardPoints("A", false); };
document.getElementById("bRightBtn").onclick = function() { awardPoints("B", true); };
document.getElementById("bWrongBtn").onclick = function() { awardPoints("B", false); };
document.getElementById("resetBtn").onclick = openResetConfirm;
document.getElementById("confirmResetYes").onclick = performReset;
document.getElementById("confirmResetNo").onclick = closeResetConfirm;

initUsedCards();
buildBoard();
updateScoreDisplay();

</script>

</body>
</html>
